# PrusaSlicer config bundle for the ESP32 printer (160 x 160 x 160 mm).
# Import: File > Import > Import Config Bundle...

[print:ESP32 Printer - 0.20mm]
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
first_layer_speed = 15
perimeter_speed = 25
small_perimeter_speed = 15
external_perimeter_speed = 20
infill_speed = 30
solid_infill_speed = 25
top_solid_infill_speed = 20
gap_fill_speed = 20
bridge_speed = 20
support_material_speed = 25
travel_speed = 50
travel_speed_z = 5
max_print_speed = 40
skirts = 1
skirt_distance = 3
skirt_height = 1
brim_width = 0
compatible_printers =
compatible_printers_condition =

[filament:ESP32 Printer PLA]
filament_type = PLA
filament_diameter = 1.75
extrusion_multiplier = 1
temperature = 200
first_layer_temperature = 205
bed_temperature = 60
first_layer_bed_temperature = 60
cooling = 1
fan_always_on = 1
min_fan_speed = 35
max_fan_speed = 70
bridge_fan_speed = 100
disable_fan_first_layers = 1
fan_below_layer_time = 60
slowdown_below_layer_time = 10
min_print_speed = 10
filament_max_volumetric_speed = 5
compatible_printers =
compatible_printers_condition =

[printer:ESP32 Printer]
printer_technology = FFF
bed_shape = 0x0,160x0,160x160,0x160
max_print_height = 160
gcode_flavor = marlin2
nozzle_diameter = 0.4
use_relative_e_distances = 1
machine_limits_usage = ignore
retract_length = 1
retract_speed = 30
deretract_speed = 0
retract_lift = 0
retract_before_travel = 2
retract_layer_change = 1
wipe = 0
z_offset = 0
start_gcode = G90\nM83\nM107\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG1 Z5 F300\nG1 X40 Y10 F3000\nG1 Z0.3 F300\nG1 X120 Y10 E6 F900\nG1 Z1 F300
end_gcode = G1 E-2 F1800\nG1 Z{min(max_layer_z + 10, max_print_height)} F300\nG1 X80 Y150 F3000\nM400\nM104 S0\nM140 S0\nM107
before_layer_gcode =
layer_gcode = G92 E0

[presets]
print = ESP32 Printer - 0.20mm
filament = ESP32 Printer PLA
printer = ESP32 Printer
